<!DOCTYPE html>
<html >
<head>
  <title>Ingreso de Usuario</title>
</head>
<body>
<h2>Introduce tu usuario</h2>
<form action="/correo/validarUsuario" method="post" th:object="${usuario}">
  <input type="text" th:field="*{nombre}" required placeholder="Nombre de usuario" />
  <button type="submit">Siguiente</button>
</form>
<p th:if="${error}" th:text="${error}" style="color:red;"></p>
</body>
</html>
